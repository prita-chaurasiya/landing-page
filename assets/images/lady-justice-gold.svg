<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="divineGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B3D91" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Divine Background Radiance -->
  <circle cx="320" cy="280" r="280" fill="url(#divineGlow)"/>

  <g filter="url(#dropShadow)">
    <!-- Scale held aloft by Left Hand (Viewer's Left) -->
    <!-- Scale Beam -->
    <path d="M 120,165 Q 210,160 300,165 L 300,172 Q 210,167 120,172 Z" fill="url(#goldLight)"/>
    <circle cx="210" cy="163" r="8" fill="url(#goldShine)"/>
    <!-- Chains & Pan Left -->
    <line x1="135" y1="170" x2="110" y2="235" stroke="url(#goldShine)" stroke-width="2.5"/>
    <line x1="135" y1="170" x2="160" y2="235" stroke="url(#goldShine)" stroke-width="2.5"/>
    <path d="M 100,235 Q 135,260 170,235 Z" fill="url(#goldLight)" stroke="#92400E" stroke-width="1.5"/>

    <!-- Chains & Pan Right -->
    <line x1="285" y1="170" x2="260" y2="235" stroke="url(#goldShine)" stroke-width="2.5"/>
    <line x1="285" y1="170" x2="310" y2="235" stroke="url(#goldShine)" stroke-width="2.5"/>
    <path d="M 250,235 Q 285,260 320,235 Z" fill="url(#goldLight)" stroke="#92400E" stroke-width="1.5"/>

    <!-- Left Arm raised holding scale -->
    <path d="M 270,225 C 255,205 235,185 210,163 C 215,160 225,162 230,170 C 250,195 275,225 285,245 Z" fill="url(#goldShine)"/>

    <!-- Head & Crown / Blindfold -->
    <!-- Hair & Tiara -->
    <path d="M 320,135 C 300,135 285,150 285,175 C 285,195 295,215 315,220 C 330,220 345,215 350,195 C 355,165 345,135 320,135 Z" fill="url(#goldShine)"/>
    <!-- Face Contour -->
    <path d="M 300,165 Q 318,195 320,215 Q 328,195 338,165 Z" fill="url(#goldLight)"/>
    <!-- Blindfold -->
    <path d="M 292,168 C 305,164 330,164 345,168 L 343,180 C 330,176 305,176 294,180 Z" fill="#FFFFFF" opacity="0.95" stroke="url(#goldShine)" stroke-width="1.5"/>

    <!-- Right Arm holding Sword -->
    <!-- Sword -->
    <g transform="translate(370, 220) rotate(-15)">
      <!-- Blade -->
      <polygon points="12,-40 18,-40 22,320 8,320" fill="url(#goldLight)"/>
      <line x1="15" y1="-35" x2="15" y2="315" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
      <!-- Crossguard -->
      <rect x="-15" y="320" width="60" height="12" rx="4" fill="url(#goldShine)"/>
      <!-- Grip -->
      <rect x="9" y="332" width="12" height="35" rx="3" fill="#78350F"/>
      <!-- Pommel -->
      <circle cx="15" cy="374" r="9" fill="url(#goldShine)"/>
    </g>
    <!-- Right Arm down to sword hilt -->
    <path d="M 345,235 C 365,260 380,310 382,345 C 375,348 368,345 365,335 C 355,300 345,265 335,248 Z" fill="url(#goldShine)"/>

    <!-- Torso / Classical Greek Chiton Drapes -->
    <path d="M 285,235 C 280,265 290,320 285,380 C 310,390 340,390 365,375 C 360,320 365,265 350,235 C 330,245 305,245 285,235 Z" fill="url(#goldLight)"/>
    <!-- Drapery folds -->
    <path d="M 295,240 Q 315,310 300,380" stroke="#92400E" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 315,245 Q 330,310 325,385" stroke="#92400E" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 335,240 Q 350,305 348,378" stroke="#92400E" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Flowing Robes / Skirt to ground -->
    <path d="M 285,380 C 270,440 250,560 240,680 C 280,705 360,705 400,680 C 390,560 380,440 365,375 Z" fill="url(#goldShine)"/>
    
    <!-- Deep Elegant Folds -->
    <path d="M 285,380 Q 275,540 260,685" stroke="#78350F" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M 310,385 Q 305,530 295,690" stroke="#78350F" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 335,385 Q 340,535 345,692" stroke="#78350F" stroke-width="3.5" fill="none" opacity="0.6"/>
    <path d="M 355,380 Q 370,530 380,685" stroke="#78350F" stroke-width="4" fill="none" opacity="0.6"/>

    <!-- Highlighting Shimmer on Fold Edges -->
    <path d="M 290,380 Q 280,540 268,685" stroke="#FFFBEB" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 340,385 Q 346,535 352,692" stroke="#FFFBEB" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Pedestal / Classical Base -->
    <path d="M 210,685 L 430,685 L 450,715 L 190,715 Z" fill="url(#goldLight)"/>
    <path d="M 180,715 L 460,715 L 470,745 L 170,745 Z" fill="url(#goldShine)"/>
    <rect x="155" y="745" width="330" height="25" rx="5" fill="url(#goldLight)"/>

    <!-- Pedestal Inscription Plate -->
    <rect x="235" y="722" width="170" height="18" rx="3" fill="#78350F" stroke="url(#goldLight)" stroke-width="1.5"/>
    <text x="320" y="735" fill="#FDE68A" font-family="'Poppins', sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="2">
      JUSTICE &amp; EQUALITY
    </text>
  </g>
</svg>

