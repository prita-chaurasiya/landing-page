<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <defs>
    <linearGradient id="awardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DB"/>
      <stop offset="20%" stop-color="#FEE140"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="80%" stop-color="#B87700"/>
      <stop offset="100%" stop-color="#734700"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B3D91"/>
      <stop offset="100%" stop-color="#061A40"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#F5A623" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Golden Laurel Wreath Left -->
  <g fill="url(#awardGold)" filter="url(#goldGlow)">
    <!-- Laurel Leaves Left -->
    <path d="M 45,180 C 35,130 50,75 95,45 C 92,60 90,80 98,95 C 75,115 62,145 60,180 Z"/>
    <path d="M 58,195 C 42,230 45,275 80,310 C 82,295 85,280 80,265 C 65,245 60,220 58,195 Z"/>
    
    <!-- Laurel Leaves Right -->
    <path d="M 275,180 C 285,130 270,75 225,45 C 228,60 230,80 222,95 C 245,115 258,145 260,180 Z"/>
    <path d="M 262,195 C 278,230 275,275 240,310 C 238,295 235,280 240,265 C 255,245 260,220 262,195 Z"/>
    
    <!-- Bottom Ribbon Tie -->
    <path d="M 120,325 Q 160,345 200,325 Q 185,350 160,355 Q 135,350 120,325 Z"/>
    <polygon points="135,345 105,375 130,365 145,350"/>
    <polygon points="185,345 215,375 190,365 175,350"/>
  </g>

  <!-- Central Shield -->
  <g filter="url(#goldGlow)">
    <path d="M 90,70 L 230,70 C 230,190 215,260 160,300 C 105,260 90,190 90,70 Z" fill="url(#awardGold)"/>
    <path d="M 98,78 L 222,78 C 222,185 208,248 160,286 C 112,248 98,185 98,78 Z" fill="url(#shieldGrad)" stroke="url(#awardGold)" stroke-width="2"/>
    <path d="M 104,84 L 216,84 C 216,180 204,240 160,276 C 116,240 104,180 104,84 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-dasharray="4,3"/>
  </g>

  <!-- Stars at Top -->
  <g fill="url(#awardGold)">
    <!-- Center Big Star -->
    <polygon points="160,95 163,105 174,105 165,112 168,122 160,116 152,122 155,112 146,105 157,105"/>
    <!-- Left Star -->
    <polygon points="132,108 134,115 142,115 135,120 137,127 132,123 127,127 129,120 122,115 130,115" transform="scale(0.85) translate(28, 20)"/>
    <!-- Right Star -->
    <polygon points="188,108 190,115 198,115 191,120 193,127 188,123 183,127 185,120 178,115 186,115" transform="scale(0.85) translate(28, 20)"/>
  </g>

  <!-- Inner Content -->
  <text x="160" y="152" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="18" text-anchor="middle" letter-spacing="1">
    HRCI
  </text>
  <text x="160" y="174" fill="url(#awardGold)" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="2">
    GLOBAL
  </text>
  <text x="160" y="196" fill="url(#awardGold)" font-family="'Poppins', sans-serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="2">
    PEACE AWARD
  </text>
  <line x1="125" y1="206" x2="195" y2="206" stroke="url(#awardGold)" stroke-width="1.5" opacity="0.8"/>
  <text x="160" y="228" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="17" text-anchor="middle" letter-spacing="3">
    2026
  </text>

  <!-- Small Dove / Peace Icon Silhouette -->
  <path d="M 152,246 C 154,242 158,242 161,244 C 165,240 172,242 168,247 C 172,248 171,253 166,252 C 164,255 158,255 156,251 C 153,251 150,248 152,246 Z" fill="url(#awardGold)"/>
</svg>

