<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="blueSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D91"/>
      <stop offset="100%" stop-color="#051C48"/>
    </linearGradient>
    <linearGradient id="redSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D90429"/>
      <stop offset="100%" stop-color="#9E001A"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#F5B82E"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#7B5600"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Diagonal Split Square Badge -->
  <g filter="url(#badgeShadow)">
    <clipPath id="squareClip">
      <rect x="10" y="10" width="180" height="180" rx="16" ry="16"/>
    </clipPath>
    
    <g clip-path="url(#squareClip)">
      <!-- Top-Left Blue Triangle -->
      <polygon points="10,10 190,10 10,190" fill="url(#blueSide)"/>
      <!-- Bottom-Right Red Triangle -->
      <polygon points="190,10 190,190 10,190" fill="url(#redSide)"/>
      <!-- Diagonal Division Gold Line -->
      <line x1="10" y1="190" x2="190" y2="10" stroke="url(#goldSeal)" stroke-width="2.5" opacity="0.6"/>
    </g>
    <!-- Border -->
    <rect x="10" y="10" width="180" height="180" rx="16" ry="16" fill="none" stroke="url(#goldSeal)" stroke-width="3"/>
  </g>

  <!-- Central Circular Golden Seal -->
  <g transform="translate(100, 100)">
    <!-- Outer Gold Ring with Beaded Dots -->
    <circle cx="0" cy="0" r="72" fill="url(#blueSide)" stroke="url(#goldSeal)" stroke-width="5"/>
    <circle cx="0" cy="0" r="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="url(#goldSeal)" stroke-width="3"/>

    <!-- Scales of Justice & Ashok Chakra -->
    <!-- Ashok Chakra Spokes -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#0B3D91" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="8" fill="#0B3D91"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    
    <!-- 16 Spokes -->
    <g stroke="#0B3D91" stroke-width="1.2" opacity="0.5">
      <line x1="0" y1="-38" x2="0" y2="38"/>
      <line x1="-38" y1="0" x2="38" y2="0"/>
      <line x1="-26.8" y1="-26.8" x2="26.8" y2="26.8"/>
      <line x1="-26.8" y1="26.8" x2="26.8" y2="-26.8"/>
      <line x1="-14.5" y1="-35.1" x2="14.5" y2="35.1"/>
      <line x1="14.5" y1="-35.1" x2="-14.5" y2="35.1"/>
      <line x1="-35.1" y1="-14.5" x2="35.1" y2="14.5"/>
      <line x1="-35.1" y1="14.5" x2="35.1" y2="-14.5"/>
    </g>

    <!-- Golden Scales Overlay -->
    <path d="M -2, -42 L 2, -42 L 2, 38 L -2, 38 Z" fill="url(#goldSeal)"/>
    <circle cx="0" cy="-42" r="4" fill="url(#goldSeal)"/>
    <!-- Beam -->
    <path d="M -30, -28 Q 0, -32 30, -28 L 30, -25 Q 0, -29 -30, -25 Z" fill="url(#goldSeal)"/>
    <!-- Left Pan -->
    <line x1="-28" y1="-26" x2="-36" y2="-8" stroke="url(#goldSeal)" stroke-width="1.5"/>
    <line x1="-28" y1="-26" x2="-20" y2="-8" stroke="url(#goldSeal)" stroke-width="1.5"/>
    <path d="M -40, -8 Q -28, 0 -16, -8 Z" fill="url(#goldSeal)"/>
    <!-- Right Pan -->
    <line x1="28" y1="-26" x2="20" y2="-8" stroke="url(#goldSeal)" stroke-width="1.5"/>
    <line x1="28" y1="-26" x2="36" y2="-8" stroke="url(#goldSeal)" stroke-width="1.5"/>
    <path d="M 16, -8 Q 28, 0 40, -8 Z" fill="url(#goldSeal)"/>
    <!-- Base -->
    <path d="M -16, 38 L 16, 38 L 12, 34 L -12, 34 Z" fill="url(#goldSeal)"/>
  </g>
</svg>

