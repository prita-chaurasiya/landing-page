<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A"/>
      <stop offset="30%" stop-color="#F5B82E"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#7B5600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D6"/>
      <stop offset="100%" stop-color="#072A6C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="235" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="12"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="250" cy="250" r="165" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Curved Text Path -->
  <path id="textCircleTop" d="M 60,250 A 190,190 0 1,1 440,250" fill="none" />
  <path id="textCircleBottom" d="M 440,250 A 190,190 0 0,1 60,250" fill="none" />

  <text fill="#FFEAA7" font-family="'Poppins', sans-serif" font-weight="700" font-size="20" letter-spacing="2.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      HUMAN RIGHTS COUNCIL OF INDIA
    </textPath>
  </text>

  <text fill="#FFEAA7" font-family="'Poppins', 'Noto Sans Devanagari', sans-serif" font-weight="700" font-size="22" letter-spacing="3">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ भारतीय मानवाधिकार परिषद ★
    </textPath>
  </text>

  <!-- Laurel Wreath in Gold around Center -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <!-- Left Leaves -->
    <path d="M 120,250 C 120,290 145,340 185,370 C 180,360 175,340 175,320 C 150,300 135,270 120,250 Z"/>
    <path d="M 115,220 C 120,200 135,175 160,150 C 155,165 155,185 160,200 C 140,205 125,215 115,220 Z"/>
    <!-- Right Leaves -->
    <path d="M 380,250 C 380,290 355,340 315,370 C 320,360 325,340 325,320 C 350,300 365,270 380,250 Z"/>
    <path d="M 385,220 C 380,200 365,175 340,150 C 345,165 345,185 340,200 C 360,205 375,215 385,220 Z"/>
  </g>

  <!-- Central Emblem: Ashok Chakra / Scales of Justice -->
  <g id="centerSymbol">
    <!-- Ashok Chakra outer ring & hub -->
    <circle cx="250" cy="250" r="130" fill="#F8FAFC" />
    <circle cx="250" cy="250" r="120" fill="none" stroke="#0B3D91" stroke-width="5" />
    <circle cx="250" cy="250" r="22" fill="#0B3D91" />
    <circle cx="250" cy="250" r="8" fill="#FFFFFF" />

    <!-- 24 Spokes -->
    <g stroke="#0B3D91" stroke-width="2.2" opacity="0.45">
      <line x1="250" y1="130" x2="250" y2="370" />
      <line x1="130" y1="250" x2="370" y2="250" />
      <line x1="165.1" y1="165.1" x2="334.9" y2="334.9" />
      <line x1="165.1" y1="334.9" x2="334.9" y2="165.1" />
      <line x1="204.1" y1="138" x2="295.9" y2="362" />
      <line x1="138" y1="204.1" x2="362" y2="295.9" />
      <line x1="295.9" y1="138" x2="204.1" y2="362" />
      <line x1="362" y1="204.1" x2="138" y2="295.9" />
      <line x1="223.3" y1="132.5" x2="276.7" y2="367.5" />
      <line x1="132.5" y1="223.3" x2="367.5" y2="276.7" />
      <line x1="276.7" y1="132.5" x2="223.3" y2="367.5" />
      <line x1="367.5" y1="223.3" x2="132.5" y2="276.7" />
    </g>

    <!-- Scales of Justice overlaid in rich 3D gold -->
    <!-- Pillar -->
    <path d="M 246,145 L 254,145 L 253,330 L 247,330 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Top finial / sphere -->
    <circle cx="250" cy="142" r="10" fill="url(#goldGrad)"/>
    <!-- Base -->
    <path d="M 215,335 L 285,335 L 275,325 L 225,325 Z" fill="url(#goldGrad)"/>
    <!-- Balance beam -->
    <path d="M 160,180 Q 250,172 340,180 L 340,187 Q 250,179 160,187 Z" fill="url(#goldGrad)"/>
    
    <!-- Left Scale Pan -->
    <line x1="170" y1="184" x2="148" y2="240" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="170" y1="184" x2="192" y2="240" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <path d="M 140,240 Q 170,258 200,240 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>

    <!-- Right Scale Pan -->
    <line x1="330" y1="184" x2="308" y2="240" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="330" y1="184" x2="352" y2="240" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <path d="M 300,240 Q 330,258 360,240 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>
  </g>

  <!-- Sub-ribbon badge on bottom -->
  <g transform="translate(0, 35)">
    <rect x="170" y="385" width="160" height="30" rx="15" fill="#E63946" stroke="#FFFFFF" stroke-width="2"/>
    <text x="250" y="405" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">
      ESTD. 2013 • INDIA
    </text>
  </g>
</svg>

